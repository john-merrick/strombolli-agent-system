[project]
name = "stromboli"
version = "0.1.0"
description = "Stromboli — agentic coding-triage worker that builds Notion-spec'd tasks via the Ralph loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
observability = [
    "langfuse>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stromboli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# `scripts/` holds the Ralph control-plane machinery, not project code.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
]
