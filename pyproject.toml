[project]
name = "stromboli"
version = "0.2.0"
description = "Stromboli — an explicit LangGraph state machine for agentic coding triage."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "litellm>=1.40",
    "claude-agent-sdk>=0.1",
    "chromadb>=0.5",
    "langfuse>=2",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stromboli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# The dashboard embeds an HTML/JS template — long lines are inherent there.
"src/stromboli/dashboard/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests are functions, never classes — so domain models named ``Test*`` (e.g.
# ``TestResult``) are not mistaken for test cases.
python_classes = ["*Tests"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260518",
]
