summary: Stromboli triage
description: >
  Spec → Prompt → Coding ⇄ Verify → PR / escalate, composed from the shared
  TriagePhases via the triage_step script. Import with `wmill flow push`, then
  tune in the Windmill UI (notably: wrap coding+verify in a while-loop for the
  revise cycle — see windmill/README.md).
value:
  modules:
    - id: init
      summary: build initial state
      value:
        type: rawscript
        language: python3
        content: |
          def main(task_id: str, source: str = "notion") -> dict:
              return {"task_id": task_id, "source": source, "raw_request": "",
                      "status": "intake"}
        input_transforms:
          task_id:
            type: javascript
            expr: flow_input.task_id
          source:
            type: javascript
            expr: flow_input.source

    - id: intake
      summary: intake (hydrate Notion task)
      value:
        type: script
        path: f/stromboli/triage_step
        input_transforms:
          phase: {type: static, value: intake}
          state: {type: javascript, expr: results.init}

    - id: spec
      summary: spec (LiteLLM gateway)
      value:
        type: script
        path: f/stromboli/triage_step
        input_transforms:
          phase: {type: static, value: spec}
          state: {type: javascript, expr: results.intake}

    - id: route_ambiguous
      summary: router (§6.3)
      value:
        type: script
        path: f/stromboli/route
        input_transforms:
          kind: {type: static, value: ambiguous}
          state: {type: javascript, expr: results.spec}

    - id: after_spec
      summary: ambiguous → escalate, else build
      value:
        type: branchone
        branches:
          - summary: ambiguous → escalate
            expr: 'results.route_ambiguous == "escalate"'
            modules:
              - id: escalate_ambiguous
                value:
                  type: script
                  path: f/stromboli/triage_step
                  input_transforms:
                    phase: {type: static, value: finalize}
                    state: {type: javascript, expr: results.spec}
        default:
          - id: prompt
            summary: prompt agent → Notion Prompt field
            value:
              type: script
              path: f/stromboli/triage_step
              input_transforms:
                phase: {type: static, value: prompt}
                state: {type: javascript, expr: results.spec}
          - id: coding
            summary: coding (Agent SDK)  # wrap this + verify in a while-loop in the UI
            value:
              type: script
              path: f/stromboli/triage_step
              input_transforms:
                phase: {type: static, value: coding}
                state: {type: javascript, expr: results.prompt}
          - id: verify
            summary: verifier (Gemini)
            value:
              type: script
              path: f/stromboli/triage_step
              input_transforms:
                phase: {type: static, value: verify}
                state: {type: javascript, expr: results.coding}
          - id: route_verdict
            value:
              type: script
              path: f/stromboli/route
              input_transforms:
                kind: {type: static, value: verdict}
                state: {type: javascript, expr: results.verify}
          - id: after_verdict
            summary: pass → PR + memory, else escalate
            value:
              type: branchone
              branches:
                - summary: pass → PR
                  expr: 'results.route_verdict == "pr"'
                  modules:
                    - id: pr
                      value:
                        type: script
                        path: f/stromboli/triage_step
                        input_transforms:
                          phase: {type: static, value: pr}
                          state: {type: javascript, expr: results.verify}
                    - id: memory
                      value:
                        type: script
                        path: f/stromboli/triage_step
                        input_transforms:
                          phase: {type: static, value: memory}
                          state: {type: javascript, expr: results.pr}
                    - id: finalize_done
                      value:
                        type: script
                        path: f/stromboli/triage_step
                        input_transforms:
                          phase: {type: static, value: finalize}
                          state: {type: javascript, expr: results.memory}
              default:
                - id: finalize_escalate
                  value:
                    type: script
                    path: f/stromboli/triage_step
                    input_transforms:
                      phase: {type: static, value: finalize}
                      state: {type: javascript, expr: results.verify}
schema:
  type: object
  properties:
    task_id: {type: string, description: Notion task page id}
    source: {type: string, default: notion}
  required: [task_id]
